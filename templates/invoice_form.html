<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Invoice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-size: 16px; /* Prevents iOS zoom on input focus */
    }
    .form-control, .form-select {
      font-size: 16px; /* Prevents iOS zoom */
    }
    .card {
      border-radius: 15px;
    }
    @media (max-width: 576px) {
      .container {
        padding: 10px;
      }
      .card {
        padding: 20px !important;
      }
      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    const dateInput = document.getElementById('invoiceDate');
    const today = new Date();

    // Format: DD-MM-YYYY
    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();

    const formattedDate = `${day}-${month}-${year}`;
    dateInput.value = formattedDate;
  });
</script>
<body class="bg-light">
  <div class="container mt-3 mt-md-5">
    <div class="card shadow p-3 p-md-4">
      <h2 class="mb-3 mb-md-4 text-center"> RME Quotation/Invoice Generator</h2>
      <form method="POST" action="/generate_invoice">
        <div class="mb-3">
          <label for="doc_type" class="form-label">Document Type<span class="text-danger">*</span></label>
          <select class="form-select" name="doc_type" required>
            <option value="INVOICE" selected>Invoice</option>
            <option value="QUOTATION">Quotation</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="customer_name" class="form-label">Client Name<span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="customer_name" required>
        </div>
        <input type="hidden" name="date" id="invoiceDate">
        <div class="mb-3">
          <label for="company_name" class="form-label">Company Name (Optional)</label>
          <input type="text" class="form-control" id="company_name" name="company_name" placeholder="Leave blank if not applicable">
        </div>
        <div class="mb-3">
          <label for="customer_address" class="form-label">Client Address (Issued to:)<span class="text-danger">*</span></label>
          <textarea class="form-control" name="customer_address" rows="4" required></textarea>
        </div>
        <div class="mb-3">
          <label for="price" class="form-label">Price (RM)<span class="text-danger">*</span></label>
          <input type="number" class="form-control" name="price" step="0.01" inputmode="decimal" required>
        </div>
        <div class="mb-3">
          <label for="song" class="form-label">How many song?</label>
          <select class="form-select" name="song">
            <option value="">None</option>
            {% for i in range(1, 8) %}
              <option value="{{ i }}">{{ i }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label for="event" class="form-label">Event Name<span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="event" required>
        </div>
        <div class="mb-3">
          <label for="event_venue" class="form-label">Event Venue<span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="event_venue" required>
        </div>
        <div class="mb-3">
          <label for="event_date" class="form-label">Event Date<span class="text-danger">*</span></label>
          <input type="date" class="form-control" name="event_date" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="event_time_start" class="form-label">Start Time (Optional)</label>
            <input type="time" class="form-control" id="event_time_start" name="event_time_start">
          </div>
          <div class="col-md-6 mb-3">
            <label for="event_time_end" class="form-label">End Time (Optional)</label>
            <input type="time" class="form-control" id="event_time_end" name="event_time_end">
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Generate</button>
      </form>
    </div>
  </div>
</body>
</html>
